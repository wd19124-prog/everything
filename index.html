  <style>

    .road:nth-of-type(2n) { stroke:#e4ad91; stroke-width:1.3; }
    .river { fill:none; stroke:#79b9d1; stroke-width:13; opacity:.78; stroke-linecap:round; }

    .place-label { fill:#6b6259; font-size:18px; font-family:"Microsoft YaHei",sans-serif; font-weight:500; opacity:.82; }
    .mobile-tools,.mobile-sheet,.sheet-backdrop,.location-status { display:none; }

      .mobile-sheet { display:block; position:fixed; z-index:14; left:0; right:0; bottom:0; max-height:72dvh; overflow:auto; background:#fff; border-radius:18px 18px 0 0; padding:12px 16px calc(18px + env(safe-area-inset-bottom)); transform:translateY(110%); transition:transform .2s ease; box-shadow:0 -8px 30px #17203330; }

      .mobile-filter { display:grid; grid-template-columns:1fr 1fr; gap:9px; }

      .location-status { position:fixed; display:block; z-index:11; top:10px; left:10px; right:10px; background:#fffffff2; border-radius:12px; padding:10px 12px; box-shadow:0 3px 14px #17203325; font-size:13px; pointer-events:none; }

      .maplibregl-popup-content { max-width:280px; }
    }

      ,{n:'沈阳烧烤（太原街/西塔一带）',c:'food',lat:41.7910,lng:123.4050,t:'东北烧烤、烤串和锅包肉是沈阳夜宵重点。'}
      ,{n:'沈阳冷面（西塔）',c:'food',lat:41.8020,lng:123.4060,t:'朝鲜族冷面、烤肉和拌菜集中区域。'}
      ,{n:'沈阳鸡架（老四季一带）',c:'food',lat:41.7900,lng:123.4300,t:'本地日常小吃代表，适合午餐或夜宵。'}
      ,{n:'东北菜（中街/老北市）',c:'food',lat:41.8070,lng:123.4230,t:'锅包肉、溜肉段、地三鲜、酸菜白肉等东北菜集中。'}
      ,{n:'沈阳早市（小河沿早市）',c:'food',lat:41.7870,lng:123.4720,t:'适合体验本地早餐和小吃；营业时间及摊位会变化。'}
      ,{n:'清河半岛',c:'leisure',lat:41.9950,lng:123.7200,t:'附件作者评价：沈阳洗浴的代表性目的地，基础门票就有造浪池、漂流、室外温泉、桑拿等设施，也可加价住宿；适合愿意在园区内休息一晚的人。营业项目和票价会变化。'}
      ,{n:'康溪温泉',c:'leisure',lat:42.0200,lng:123.7500,t:'附件作者评价：位于本溪方向，风格比清河半岛更偏便利休闲，集温泉疗养与室内水上娱乐于一体，适合家庭出行追求性价比；往返车程需单独安排。'}
    ];
    const map = new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[123.47,41.805],zoom:9.8,attributionControl:true});
    map.addControl(new maplibregl.NavigationControl(),'top-left');
    const layers = {}, markers = {};
    Object.keys(categories).forEach(k=>layers[k]=[]);
    const details={
      '沈阳故宫':{price:'成人票常见为 50 元左右；以国庆当期公告为准',book:'通过“沈阳故宫博物院”官方公众号/官网或授权平台实名预约，按预约时段入馆'},
      '张学良旧居（大帅府）':{price:'票价以景区当期公告为准',book:'建议通过官方公众号或授权票务平台预约'},
      '“九一八”历史博物馆':{price:'通常免费，可能需要实名预约',book:'通过场馆官方渠道或官方公众号预约，携带有效证件'},
      '辽宁省博物馆':{price:'通常免费，特展可能另收费',book:'通过辽宁省博物馆官方公众号预约入馆'},
      '辽宁省科技馆':{price:'通常免费，部分活动可能收费',book:'通过辽宁省科技馆官方公众号预约'},
      '北陵公园（昭陵）':{price:'公园及昭陵区域按当期公告购票',book:'一般无需分时预约，节假日先核实开放安排'},
      '棋盘山风景区':{price:'景区各项目分别计费',book:'通过景区官方渠道确认门票、停车和项目预约'},
      '沈阳世博园':{price:'票价随季节和活动调整',book:'通过沈阳世博园官方渠道或授权平台购票'},
      '沈阳森林动物园':{price:'票价以景区当期公告为准',book:'建议通过官方渠道提前购票'},
      '清福陵（东陵）':{price:'与盛京三陵相关联票/单票政策以当期公告为准',book:'出发前确认开放和购票方式'}
    };
    let userPosition=null, nearbyOnly=false, userMarker=null;
    const selected=Object.fromEntries(Object.keys(categories).map(k=>[k,true]));
    places.forEach((p,i)=>{
      const cat=categories[p.c];
      const d=details[p.n]||{};
      const image=p.img||cat.img;
      const price=p.price||d.price;
      const book=p.book||d.book;
      const extra=(price||book)?`<div style="margin-top:6px">${price?`<b>门票：</b>${price}<br>`:''}${book?`<b>预约：</b>${book}`:''}</div>`:'';
      const nav=`https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.n)}&callnative=1`;
      const popupHtml=`<div class="popup-title">${p.n}</div><img src="${image}" alt="${p.n}代表性图片" style="width:100%;max-height:150px;object-fit:cover;border-radius:4px;margin:5px 0"><div class="popup-meta">${cat.name}</div><div>${p.t}</div>${extra}<a class="navigate-link" href="${nav}" target="_blank" rel="noopener">在地图中导航</a>`;
      const m=new maplibregl.Marker({color:cat.color}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup({maxWidth:'290px'}).setHTML(popupHtml)).addTo(map);
      layers[p.c].push(m); markers[i]=m; p.i=i;
    });
    const legend=document.getElementById('legend');
    const filters=document.getElementById('filters');
    const mobileFilter=document.getElementById('mobile-filter');
    Object.entries(categories).forEach(([k,v])=>{
      legend.insertAdjacentHTML('beforeend',`<span style="font-size:12px"><i class="swatch" style="background:${v.color}"></i>${v.name}</span>`);
      filters.insertAdjacentHTML('beforeend',`<label><input type="checkbox" checked data-cat="${k}"> 显示${v.name}</label>`);
      mobileFilter.insertAdjacentHTML('beforeend',`<label><input type="checkbox" checked data-mobile-cat="${k}"><span><i class="swatch" style="background:${v.color}"></i>${v.name}</span></label>`);
    });
    const distanceKm=(a,b)=>{const r=6371, dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const q=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*r*Math.asin(Math.sqrt(q));};
    const isVisible=p=>selected[p.c]&&(!nearbyOnly||(userPosition&&distanceKm(userPosition,p)<=5));
    const categoryOrder=Object.keys(categories);
    const sortedVisiblePlaces=()=>places.filter(isVisible).sort((a,b)=>{
      const categoryDiff=categoryOrder.indexOf(a.c)-categoryOrder.indexOf(b.c);
      if(categoryDiff!==0)return categoryDiff;
      if(!userPosition)return a.i-b.i;
      return distanceKm(userPosition,a)-distanceKm(userPosition,b);
    });
    function applyVisibility(){places.forEach(p=>markers[p.i].getElement().style.display=isVisible(p)?'':'none');renderList();}
    function renderList(){
      const rows=sortedVisiblePlaces().map(p=>`<div class="item" data-index="${p.i}"><strong><span class="swatch" style="background:${categories[p.c].color}"></span>${p.n}</strong><small>${categories[p.c].name}${userPosition?` · ${distanceKm(userPosition,p).toFixed(1)} km`:''} · ${p.t}</small></div>`).join('');
      document.getElementById('list').innerHTML=rows;
      document.getElementById('mobile-list').innerHTML=rows||'<div class="note">当前条件下没有地点。</div>';
      document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>{const p=places[el.dataset.index];map.flyTo({center:[p.lng,p.lat],zoom:14});markers[p.i].togglePopup();closeSheet();}));
    }
    function setCategory(k,on){selected[k]=on;document.querySelectorAll(`[data-cat="${k}"],[data-mobile-cat="${k}"]`).forEach(x=>x.checked=on);applyVisibility();}
    document.querySelectorAll('[data-cat]').forEach(cb=>cb.addEventListener('change',()=>setCategory(cb.dataset.cat,cb.checked)));
    document.querySelectorAll('[data-mobile-cat]').forEach(cb=>cb.addEventListener('change',()=>setCategory(cb.dataset.mobileCat,cb.checked)));
    const sheet=document.getElementById('mobile-sheet'),backdrop=document.getElementById('sheet-backdrop');
    function openSheet(){sheet.classList.add('open');backdrop.classList.add('open');}
    function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('open');}
    document.getElementById('filter-btn').addEventListener('click',openSheet);
    document.getElementById('sheet-close').addEventListener('click',closeSheet);
    backdrop.addEventListener('click',closeSheet);
    function setStatus(message){const el=document.getElementById('location-status');el.textContent=message; if(message)setTimeout(()=>{if(el.textContent===message)el.textContent='';},5000);}
    function locate(){
      if(!navigator.geolocation){setStatus('当前浏览器不支持定位');return;}
      setStatus('正在获取当前位置…');
      navigator.geolocation.getCurrentPosition(pos=>{
        userPosition={lng:pos.coords.longitude,lat:pos.coords.latitude,accuracy:pos.coords.accuracy};
        if(userMarker)userMarker.remove();
        const dot=document.createElement('div');dot.style.cssText='width:18px;height:18px;border:4px solid white;border-radius:50%;background:#1677ff;box-shadow:0 0 0 5px #1677ff44';
        userMarker=new maplibregl.Marker({element:dot}).setLngLat([userPosition.lng,userPosition.lat]).addTo(map);
        map.flyTo({center:[userPosition.lng,userPosition.lat],zoom:13});
        setStatus(`定位成功，精度约 ${Math.round(userPosition.accuracy)} 米`);applyVisibility();
      },err=>{const msg=err.code===1?'定位权限被拒绝，请在浏览器设置中允许位置访问':'暂时无法获取位置，请检查 GPS 和网络';setStatus(msg);},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
    }
    document.getElementById('locate-btn').addEventListener('click',locate);
    document.getElementById('nearby-btn').addEventListener('click',()=>{if(!userPosition){setStatus('请先点击“我的位置”完成定位');return;}nearbyOnly=!nearbyOnly;document.getElementById('nearby-btn').classList.toggle('is-active',nearbyOnly);applyVisibility();setStatus(nearbyOnly?'只显示当前位置 5 公里内地点':'已显示全部已选分类地点');});
    document.getElementById('place-count').textContent=places.length;
    renderList();
  </script>
</body>
</html>
