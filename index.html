    function openTimeSheet(date,index){const d=itinerary.find(x=>x.date===date),event=d?.events[index];if(!event)return;let sheet=document.getElementById('time-edit-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='time-edit-sheet';sheet.className='trip-sheet';sheet.innerHTML='<h3>调整到达时间</h3><p>只会重新计算这一站及之后的安排，之前的时间保持不变。</p><input id="time-edit-value" type="time" step="60"><div class="trip-sheet-actions"><button class="cancel" id="time-edit-cancel">取消</button><button id="time-edit-save">保存</button></div>';document.body.appendChild(sheet);document.getElementById('time-edit-cancel').onclick=()=>sheet.classList.remove('open');}document.getElementById('time-edit-value').value=event.time.match(/^\d{2}:\d{2}/)?.[0]||'09:30';document.getElementById('time-edit-save').onclick=()=>{const value=document.getElementById('time-edit-value').value;if(!value)return;event.time=value;reflowDayFrom(date,index);persistState();sheet.classList.remove('open');renderItinerary();renderNext();};sheet.classList.add('open');}
    function optimizeDay(date){const d=itinerary.find(x=>x.date===date);if(!d||d.events.length<2)return;const remaining=d.events.slice();const ordered=[];let here={lat:41.805,lng:123.45};while(remaining.length){let best=remaining.reduce((a,b)=>distance(here,eventPlace(a))<distance(here,eventPlace(b))?a:b);ordered.push(best);remaining.splice(remaining.indexOf(best),1);here=eventPlace(best);}d.events.splice(0,d.events.length,...ordered);reflowDay(date);}

    function openAddSheet(){let sheet=document.getElementById('trip-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='trip-sheet';sheet.className='trip-sheet';sheet.innerHTML=`<h3>添加到行程</h3><p>先选择省份和城市，再输入地点名称。输入后会搜索地图中的标准地点名称。</p><input id="new-date" type="date"><select id="new-province">${regionProvinces.map(province=>`<option value="${province}">${province}</option>`).join('')}</select><select id="new-city"></select><input id="new-name" class="place-suggestions" placeholder="输入地点名称并选择搜索结果"><div id="place-suggestion-list" class="place-suggestion-list"></div><select id="new-category" style="display:none"><option value="history">历史文化</option></select><input id="new-duration" value="预计1小时" style="display:none"><textarea id="new-note" style="display:none"></textarea><div class="trip-sheet-actions"><button class="cancel" id="close-trip-sheet">取消</button><button id="confirm-add-trip">添加</button></div>`;document.body.appendChild(sheet);document.getElementById('new-province').onchange=populateAddCities;document.getElementById('new-name').oninput=searchPlaceSuggestions;document.getElementById('close-trip-sheet').onclick=()=>sheet.classList.remove('open');document.getElementById('confirm-add-trip').onclick=async()=>{const name=document.getElementById('new-name').value.trim();const rawDate=document.getElementById('new-date').value;if(!name||!rawDate)return;const category=inferCategory(name);document.getElementById('new-category').value=category;document.getElementById('new-duration').value=inferDuration(name,category);const day=ensureItineraryDate(rawDate);window.selectedDate=day.date;await addEvent(day.date);document.getElementById('new-name').value='';sheet.classList.remove('open');};}document.getElementById('new-date').value=todayInputValue();document.getElementById('new-province').value=detectedProvince;populateAddCities();document.getElementById('new-city').value=detectedCity;sheet.classList.add('open');if(!userPosition&&navigator.geolocation)navigato     function renderPlannerQuestions(){const sheet=document.getElementById('planner-sheet');if(!sheet)return;const q=[['mood','这趟旅行最期待什么？',['当地美食','历史文化','自然风景','休闲放松']],['party','想和谁一起出发？',['独自出发','伴侣','朋友','家人']],['transport','主要交通方式？',['飞机','火车','自驾','其他']],['pace','希望怎样的旅行节奏？',['轻松慢游','平衡安排','充实紧凑']],['needs','旅途中需要特别留意？',['避免剧烈运动','带孩子','无障碍设施','晕车/晕船','暂无特殊需求']],['avoid','什么情况会让你扫兴？',['行程太满','景点拥挤','花费超支','等待太久','长时间赶路']]];sheet.querySelector('#planner-questions').innerHTML=q.map(([key,title,opts])=>`<section class="planner-question planner-question-card"><strong>${title}</strong><div class="planner-options">${opts.map((x,i)=>`<label><input type="radio" name="plan-${key}" value="${x}" ${i===0?'checked':''}>${x}</label>`).join('')}</div></section>`).join('');}
    function openPlannerSheet(){let sheet=document.getElementById('planner-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='planner-sheet';sheet.className='trip-sheet planner-sheet';sheet.innerHTML='<div class="planner-step active" data-step="1"><h3>帮我规划</h3><p>先确定旅行时间和目标地区。</p><div class="planner-fields"><label>开始日期<input id="plan-start" type="date"></label><label>结束日期<input id="plan-end" type="date"></label></div><label style="display:block;margin-top:8px;color:#767987;font-size:12px">目标地区<input id="plan-destination" class="place-suggestions" list="plan-city-options" placeholder="输入城市或地区"><datalist id="plan-city-options"></datalist></label><div id="plan-destination-hints" class="place-suggestion-list"></div><div class="trip-sheet-actions"><button class="cancel" id="plan-cancel">取消</button><button id="plan-next">下一步</button></div></div><div class="planner-step" data-step="2"><div class="planner-progress">第 2 步 · 旅行偏好</div><h3>告诉我你的偏好</h3><p>这些答案只用于生成本次路线。</p><div id="planner-questions"></div><div class="trip-sheet-actions"><button class="cancel" id="plan-back">上一步</button><button id="plan-generate">生成路线</button></div></div>';document.body.appendChild(sheet);const opts=plannerCityCandidates();sheet.querySelector('#plan-city-options').innerHTML=opts.map(x=>`<option value="${x}">`).join('');const destinationInput=sheet.querySelector('#plan-destination'),hints=sheet.querySelector('#plan-destination-hints');destinationInput.oninput=()=>{const q=destinationInput.value.trim();const matches=opts.filter(x=>x.includes(q)).slice(0,8);hints.innerHTML=matches.map(x=>`<button type="button" class="place-suggestion-item">${x}</button>`).join('');hints.classList.toggle('open',Boolean(q&&matches.length));hints.querySelectorAll('button').forEach(b=>b.onclick=()=>{destinationInput.value=b.textContent;hints.classList.remove('open');});};sheet.querySelector('#plan-cancel').onclick=()=>sheet.classList.remove('open');sheet.querySelector('#plan-next').onclick=()=>{const start=sheet.querySelector('#plan-start').value,end=sheet.querySelector('#plan-end').value,destination=sheet.querySelector('#plan-destination').value.trim();if(!start||!end||!destination||dateStamp(start)>dateStamp(end)){alert('请先填写有效的日期范围和目标地区');return;}planningState={start,end,destination,answers:{}};sheet.querySelector('[data-step="1"]').classList.remove('active');sheet.querySelector('[data-step="2"]').classList.add('active');renderPlannerQuestions();};sheet.querySelector('#plan-back').onclick=()=>{sheet.querySelector('[data-step="2"]').classList.remove('active');sheet.querySelector('[data-step="1"]').classList.add('active');};sheet.querySelector('#plan-generate').onclick=()=>{sheet.querySelectorAll('#planner-questions input:checked').forEach(x=>planningState.answers[x.name.replace('plan-','')]=x.value);sheet.classList.remove('open');showPlanLoading();};}sheet.querySelector('#plan-start').value=planningState.start||todayInputValue();sheet.querySelector('#plan-end').value=planningState.end||todayInputValue();sheet.querySelector('#plan-destination').value=planningState.destination||detectedCity;sheet.querySelector('[data-step="1"]').classList.add('active');sheet.querySelector('[data-step="2"]').classList.remove('active');sheet.classList.add('open');}
    function planningDays(){const out=[];let cursor=new Date(`${planningState.start}T12:00:00`),end=new Date(`${planningState.end}T12:00:00`);while(cursor<=end&&out.length<31){out.push(`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`);cursor.setDate(cursor.getDate()+1);}return out;}
    async function loadPlanningDestinationPlaces(){const destination=planningState.destination,city=destination.replace(/市$/,'');if(places.some(p=>String(p.city||'').replace(/市$/,'').includes(city)))return;try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);const geo=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cn&accept-language=zh-CN&q=${encodeURIComponent(destination)}`,{signal:controller.signal}).then(r=>r.json());if(!geo[0])throw new Error('city not found');const lat=Number(geo[0].lat),lng=Number(geo[0].lon);const query=`[out:json][timeout:12];(nwr(around:25000,${lat},${lng})[tourism];nwr(around:25000,${lat},${lng})[historic];nwr(around:25000,${lat},${lng})[amenity~"^(restaurant|cafe|food_court|theatre|arts_centre)$"];nwr(around:25000,${lat},${lng})[leisure~"^(park|nature_reserve|spa)$"];);out center tags;`;let response=await fetch(`https://overpass.kumi.systems/api/interpreter?data=${encodeURIComponent(query)}`,{signal:controller.signal});if(!response.ok)response=await fetch(`https://overpass.private.coffee/api/interpreter?data=${encodeURIComponent(query)}`,{signal:controller.signal});if(!response.ok)throw new Error('place query failed');const data=await response.json();clearTimeout(timer);const existing=new Set(places.map(p=>p.n));data.elements.map(x=>{const tags=x.tags||{},c=nearbyCategory(tags),name=tags['name:zh']||tags.name;if(!c||!name||existing.has(name)||!qualityPlace(tags,c))return null;const lat2=Number(x.lat??x.center?.lat),lng2=Number(x.lon??x.center?.lon);if(!Number.isFinite(lat2)||!Number.isFinite(lng2))return null;const score=['website','wikidata','wikipedia','official_name','operator','opening_hours'].filter(k=>tags[k]).length;return{n:name,c,lat:lat2,lng:lng2,city:destination,province:'',custom:true,qualityScore:score,t:`${name}位于${destination}，根据公开地图资料筛选；开放时间、票价和实际体验请以官方信息为准。`};}).filter(Boolean).sort((a,b)=>b.qualityScore-a.qualityScore).slice(0,24).forEach(p=>{existing.add(p.n);p.i=places.length;places.push(p);addPlaceMarker(p);});}catch(e){planningState.lookupFailed=true;} }
    function buildPlan(){const days=planningDays(),city=planningState.destination.replace(/市$/,'');const known=places.filter(p=>String(p.city||'').replace(/市$/,'').includes(city)||String(p.n||'').includes(city));const picks=known.slice(0,Math.max(3,days.length*2));return days.map((raw,i)=>{const selected=picks.slice(i*2,i*2+2);const names=selected.length?selected.map(p=>p.n):[`${planningState.destination}城市漫游`,`${planningState.destination}当地美食`];return{raw,date:dateLabel(raw),label:['第一天','第二天','第三天','第四天','第五天'][i]||`第${i+1}天`,route:names.join(' → '),events:names.map((name,j)=>({time:j?'14:00':'10:00',name,duration:j?'约2小时':'约2.5小时',note:`${planningState.destination} · ${planningState.answers.mood||'按偏好安排'}`}))};});}

    async function estimateTravelTime(origin,destination,mode){const fallback=mode==='drive'?'约4小时':'约4小时（含机场流程）';try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2500);const geo=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=2&countrycodes=cn&accept-language=zh-CN&q=${encodeURIComponent(origin)}`,{signal:controller.signal}).then(r=>r.json());clearTimeout(timer);if(!geo[0])return fallback;if(mode!=='drive')return fallback;const routeController=new AbortController(),routeTimer=setTimeout(()=>routeController.abort(),2500),route=await fetch(`https://router.project-osrm.org/route/v1/driving/${geo[0].lon},${geo[0].lat};123.449,41.7967?overview=false`,{signal:routeController.signal}).then(r=>r.json());clearTimeout(routeTimer);const seconds=route.routes?.[0]?.duration;if(!seconds)return fallback;return `约${Math.max(1,Math.round(seconds/3600))}小时`; }catch(e){return fallback;}}
    function buildPlan(){const days=planningDays(),answers=planningState.answers||{},mood=(answers.mood||[]).join('、'),pace=(answers.pace||[]).join('、'),party=(answers.party||[]).join('、'),avoid=(answers.avoid||[]).join('、'),target=mood.includes('当地美食')?'food':mood.includes('历史文化')?'history':mood.includes('自然风景')?'nature':mood.includes('休闲放松')?'leisure':'';let perDay=pace.includes('轻松')?1:pace.includes('充实')?3:2;if(avoid.includes('行程太满'))perDay=1;const ranked=plannerDestinationPlaces().slice().sort((a,b)=>{const score=p=>{let s=0;if(target&&(p.c===target||(target==='history'&&p.c==='museum')))s+=8;if(avoid.includes('景点拥挤')&&p.c==='nature')s+=3;if(party.includes('家人')&&['nature','museum'].includes(p.c))s+=2;if(party.includes('独自出发')&&['food','district'].includes(p.c))s+=2;return s};return score(b)-score(a)}),travelMinutes=/([0-9]+)小时/.test(answers.travelTime||'')?Number(RegExp.$1)*60:0;let cursor=0;return days.map((raw,i)=>{let count=perDay;if(i===0&&travelMinutes>=180)count=1;const selected=ranked.slice(cursor,cursor+count);cursor+=count;const names=selected.length?selected.map(p=>p.n):[`${planningState.destination}城市漫步`];const start=i===0&&travelMinutes>=180?'16:00':'10:00';return{raw,date:dateLabel(raw),label:['第一天','第二天','第三天','第四天','第五天'][i]||`第${i+1}天`,route:names.join(' → '),events:names.map((name,j)=>({time:j?`${String(13+j).padStart(2,'0')}:30`:start,name,duration:j?'约2小时':'约2.5小时',note:`${planningState.destination} · ${mood||'按偏好安排'}${answers.travelTime?` · 交通${answers.travelTime}`:''}${party?` · ${party}`:''}`}))};});}
    async function estimateTravelTime(origin,destination,mode){const fallback=mode==='drive'?'约4小时':'约4小时（含机场流程）';try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2200);const results=await Promise.all([origin,destination].map(q=>fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=cn&accept-language=zh-CN&q=${encodeURIComponent(q)}`,{signal:controller.signal}).then(r=>r.json())));clearTimeout(timer);if(mode!=='drive'||!results[0][0]||!results[1][0])return fallback;const routeController=new AbortController(),routeTimer=setTimeout(()=>routeController.abort(),2200),route=await fetch(`https://router.project-osrm.org/route/v1/driving/${results[0][0].lon},${results[0][0].lat};${results[1][0].lon},${results[1][0].lat}?overview=false`,{signal:routeController.signal}).then(r=>r.json());clearTimeout(routeTimer);const seconds=route.routes?.[0]?.duration;return seconds?`约${Math.max(1,Math.round(seconds/3600))}小时`:fallback;}catch(e){return fallback;}}
    document.addEventListener('click',event=>{if(event.target.id!=='plan-next-2')return;setTimeout(()=>{const sheet=document.getElementById('planner-sheet'),transport=(planningState.answers?.transport||[]).join('、');if(!sheet||!/飞机/.test(transport)||sheet.querySelector('#flight-times-enhanced'))return;const old=sheet.querySelector('#plan-flight-time');if(!old)return;old.outerHTML='<span id="flight-times-enhanced" class="planner-fields"><label>起飞时间<input id="plan-flight-departure" type="time"></label><label>到达时间<input id="plan-flight-arrival" type="time"></label><input id="plan-flight-time" type="text" hidden></span>';const sync=()=>{sheet.querySelector('#plan-flight-time').value=`${sheet.querySelector('#plan-flight-departure').value||''} - ${sheet.querySelector('#plan-flight-arrival').value||''}`;};sheet.querySelector('#plan-flight-departure').oninput=sync;sheet.querySelector('#plan-flight-arrival').oninput=sync;},0);});
    function updatePlanCopy(){const title=document.querySelector('#itinerary-content .itinerary-empty h3');if(title)title.textContent='打算去哪儿';}
    async function showPlanLoading(){let sheet=document.getElementById('plan-loading-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='plan-loading-sheet';sheet.className='trip-sheet planner-sheet';sheet.innerHTML='<div class="planner-loading"><h3>正在生成你的路线</h3><p>正在结合问卷偏好和交通信息整理中</p><div class="footprints"><i></i><i></i><i></i><i></i></div></div>';document.body.appendChild(sheet);}sheet.classList.add('open');if(!plannerDestinationPlaces().length)await Promise.race([loadPlanningDestinationPlaces(),new Promise(resolve=>setTimeout(resolve,4000))]);const plan=buildPlan(),flight=(planningState.answers?.flightTime||'').match(/-\s*(\d{1,2}):(\d{2})/);if(flight&&plan[0]?.events?.[0]){let minutes=Number(flight[1])*60+Number(flight[2])+60;plan[0].events[0].time=`${String(Math.floor(minutes/60)%24).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;}sheet.classList.remove('open');showPlanPreview(plan);}
    enrichRestoredPlaces();renderNext();renderItinerary();updatePlanCopy();renderDiscover('all');showView('next');
    if('serviceWorker' in navigator){window.addEventListener('load',async()=>{try{const registration=await navigator.serviceWorker.register('./sw.js');navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__swReloaded){window.__swReloaded=true;window.location.reload();}});await registration.update();if(registration.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});}catch(e){}});}
  </script>
