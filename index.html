<body>
  <section id="next-view" class="app-view active" aria-label="下一项安排"><div class="app-inner" id="next-content"></div></section>
  <section id="itinerary-view" class="app-view" aria-label="每日行程"><div class="app-inner" id="itinerary-content"></div></section>
  <section id="detail-view" class="app-view" aria-label="地点详情"><div class="app-inner" id="detail-content"></div></section>
  <section id="expenses-view" class="app-view" aria-label="花费"><div class="app-inner" id="expenses-content"></div></section>
  <section id="discover-view" class="app-view discover-view" aria-label="发现身边"><div class="discover-controls"><button type="button" class="discover-locate" onclick="locate()">⌖ 定位附近</button><h2>发现身边</h2><p>地图全览 · 找到附近值得去的地方</p><div class="discover-filters" id="discover-filters"></div></div><div class="discover-sheet"><h3>附近地点</h3><div id="discover-list"></div></div></section>
  <nav class="bottom-nav" aria-label="主导航"><button type="button" data-view="next"><span>⌁</span>下一项安排</button><button type="button" data-view="itinerary"><span>▦</span>行程安排</button><button type="button" data-view="expenses"><span>¥</span>花费</button><button type="button" data-view="discover"><span>⌖</span>发现身边</button></nav>
  <header><h1>一程｜记录你的每一步，规划你的每一程</h1><div class="sub">按类别筛选值得去、值得玩、值得吃的地点；点地图标记可看推荐理由。</div></header>
  <div class="layout">
    <div id="map" aria-label="沈阳旅行地点地图"></div>
    <aside>
      <div class="legend" id="legend"></div>
      <div class="filters" id="filters"></div>
      <div id="list"></div>
      <div class="note">已整理 <span id="place-count">0</span> 个标记。短评优先整理自附件文章，作者未亲测或可能变动的项目已注明；图片为地点或类别的代表性配图。国庆前请再确认营业、排队、搬迁和预约规则，开放、票价以官方公告为准。</div>
    </aside>
  </div>
  <div class="location-status" id="location-status" aria-live="polite"></div>
  <nav class="mobile-tools" aria-label="地图工具">
    <button type="button" id="locate-btn">⌖ 我的位置</button>
    <button type="button" id="nearby-btn">◎ 附近</button>
    <button type="button" id="filter-btn">☷ 分类</button>
  </nav>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="mobile-sheet" id="mobile-sheet" aria-label="分类和地点筛选">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><strong>分类筛选</strong><button type="button" id="sheet-close" aria-label="关闭">×</button></div>
    <div class="mobile-filter" id="mobile-filter"></div>

l class="expense-filter">起止时间<div class="expense-time-range"><input type="date" data-expense-filter="start" value="${expenseFilterState.start}"><input type="date" data-expense-filter="end" value="${expenseFilterState.end}"></div></label><label class="expense-filter expense-choice">城市<select multiple data-expense-filter="city">${selectOptions('city',cities.length?cities:['沈阳'])}</select></label><label class="expense-filter expense-choice">分类<select multiple data-expense-filter="category">${selectOptions('category',categoriesList)}</select></label></div><div class="expense-summary"><button type="button" class="secondary" data-expense-month="prev">‹</button><strong>${year}年${month}月</strong><button type="button" class="secondary" data-expense-month="next">›</button></div><div class="expense-calendar">${['日','一','二','三','四','五','六'].map(x=>`<div class="expense-weekday">${x}</div>`).join('')}${calendar}</div><div class="expense-list">${list}</div>`;root.querySelectorAll('[data-expense-filter]').forEach(control=>control.onchange=()=>{if(control.multiple)expenseFilterState[control.dataset.expenseFilter]=[...control.selectedOptions].map(x=>x.value);else expenseFilterState[control.dataset.expenseFilter]=control.value;renderExpenses();});root.querySelectorAll('.expense-choice').forEach(control=>{const select=control.querySelector('select');const sync=()=>select.classList.toggle('empty-filter',!select.selectedOptions.length);sync();select.onfocus=()=>select.classList.remove('empty-filter');select.onblur=sync;});root.querySelector('[data-expense-month="prev"]').onclick=()=>{expenseCalendarMonth=new Date(year,month-2,1);renderExpenses()};root.querySelector('[data-expense-month="next"]').onclick=()=>{expenseCalendarMonth=new Date(year,month,1);renderExpenses()};};
    const baseExpenseRender=renderExpenses;
    function normalizeExpenseView(){const root=document.getElementById('expenses-content');if(!root)return;root.querySelector('.app-sub')?.remove();const title=root.querySelector('.expense-page-title'),result=root.querySelector('.expense-summary');if(title&&result&&!root.querySelector('.expense-title-row')){const row=document.createElement('div');row.className='expense-title-row';title.parentNode.insertBefore(row,title);row.append(title,result);}const range=root.querySelector('.expense-time-range');if(range&&!root.querySelector('.expense-filter-start')){const parent=range.parentElement;const start=document.createElement('label');start.className='expense-filter expense-filter-start';start.textContent='开始时间';const end=document.createElement('label');end.className='expense-filter expense-filter-end';end.textContent='结束时间';start.append(range.querySelector('[data-expense-filter="start"]'));end.append(range.querySelector('[data-expense-filter="end"]'));parent.replaceWith(start,end);}}

    renderItinerary=function(){baseRenderItinerary();const root=document.getElementById('itinerary-content');if(!root||root.querySelector('.sync-box'))return;const box=document.createElement('div');box.className='sync-box';box.innerHTML=`<h3>跨设备同步</h3><p>创建或加入同一个旅行空间，行程、勾选和花销会同步到其他设备。</p><div class="sync-row"><input id="trip-id-input" value="${tripId}" placeholder="旅行空间编号"><button id="create-trip">创建</button><button id="join-trip">读取</button></div><div class="sync-status">${tripId?'当前空间：'+tripId:'尚未连接云端空间'}</div>`;root.appendChild(box);document.getElementById('create-trip').onclick=()=>{tripId=makeTripId();localStorage.setItem('sy-trip-id',tripId);renderItinerary();pushCloud();};document.getElementById('join-trip').onclick=()=>{const value=document.getElementById('trip-id-input').value.trim().toUpperCase();if(!value)return;tripId=value;localStorage.setItem('sy-trip-id',tripId);pullCloud();};};
    function eventPlace(e){return placeByName(e.name)||{lat:41.805,lng:123.45};}
    function distance(a,b){return Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*84)}
    function reflowDay(date){const d=itinerary.find(x=>x.date===date);if(!d)return;reflowDayFrom(date,0);}
    function reflowDayFrom(date,start){const d=itinerary.find(x=>x.date===date);if(!d||!d.events[start])return;let cursor=Number(d.events[start].time?.split(':')[0])*60+Number(d.events[start].time?.split(':')[1]||0);if(!Number.isFinite(cursor))cursor=9*60+30;for(let i=start;i<d.events.length;i++){const e=d.events[i];if(i>start){const prev=eventPlace(d.events[i-1]),cur=eventPlace(e);cursor+=Math.max(15,Math.round(distance(prev,cur)*8));e.time=`${String(Math.floor(cursor/60)).padStart(2,'0')}:${String(cursor%60).padStart(2,'0')}`;}const mins=/([0-9.]+)小时/.exec(e.duration||'');cursor+=mins?Math.round(Number(mins[1])*60):60;}}
    function openTimeSheet(date,index){const d=itinerary.find(x=>x.date===date),event=d?.events[index];if(!event)return;let sheet=document.getElementById('time-edit-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='time-edit-sheet';sheet.className='trip-sheet';sheet.innerHTML='<h3>调整到达时间</h3><p>只会重新计算这一站及之后的安排，之前的时间保持不变。</p><input id="time-edit-value" type="time" step="60"><div class="trip-sheet-actions"><button class="cancel" id="time-edit-cancel">取消</button><button id="time-edit-save">保存</button></div>';document.body.appendChild(sheet);document.getElementById('time-edit-cancel').onclick=()=>sheet.classList.remove('open');}document.getElementById('time-edit-value').value=event.time.match(/^\d{2}:\d{2}/)?.[0]||'09:30';document.getElementById('time-edit-save').onclick=()=>{const value=document.getElementById('time-edit-value').value;if(!value)return;event.time=value;reflowDayFrom(date,index);persistState();sheet.classList.remove('open');renderItinerary();renderNext();};sheet.classList.add('open');}
    function optimizeDay(date){const d=itinerary.find(x=>x.date===date);if(!d||d.events.length<2)return;const remaining=d.events.slice();const ordered=[];let here={lat:41.805,lng:123.45};while(remaining.length){let best=remaining.reduce((a,b)=>distance(here,eventPlace(a))<distance(here,eventPlace(b))?a:b);ordered.push(best);remaining.splice(remaining.indexOf(best),1);here=eventPlace(best);}d.events.splice(0,d.events.length,...ordered);reflowDay(date);}
    function moveEvent(fromDate,fromIndex,toDate,toIndex){const from=itinerary.find(x=>x.date===fromDate),to=itinerary.find(x=>x.date===toDate);if(!from||!to)return;const [event]=from.events.splice(Number(fromIndex),1);let idx=Math.max(0,Math.min(Number(toIndex),to.events.length));to.events.splice(idx,0,event);if(fromDate!==toDate){moveCounts[event.name]=(moveCounts[event.name]||0)+1;if(moveCounts[event.name]===1)optimizeDay(toDate);else reflowDay(toDate);}else reflowDay(toDate);persistState();renderItinerary();renderNext();}
    function populateAddCities(){const province=document.getElementById('new-province')?.value||detectedProvince;const select=document.getElementById('new-city');if(!select)return;const cities=regionCities(province);select.innerHTML=cities.map(city=>`<option value="${city}">${city}</option>`).join('');if(cities.includes(detectedCity))select.value=detectedCity;}
    let suggestionTimer=null;
    async function searchPlaceSuggestions(){const input=document.getElementById('new-name'),list=document.getElementById('place-suggestion-list');if(!input||!list)return;clearTimeout(suggestionTimer);if(input.value.trim().length<2){list.classList.remove('open');list.innerHTML='';return;}suggestionTimer=setTimeout(async()=>{try{const q=encodeURIComponent(`${input.value.trim()} ${document.getElementById('new-city')?.value||detectedCity}`);const data=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=zh-CN&q=${q}`,{headers:{Accept:'application/json'}}).then(r=>r.json());list.innerHTML=data.map((x,i)=>{const label=x.name||String(x.display_name||'').split(',')[0],detail=x.display_name||'';return `<button type="button" class="place-suggestion-item" data-suggestion-name="${String(label).replace(/"/g,'&quot;')}">${String(label)}<small>${String(detail)}</small></button>`}).join('');list.classList.toggle('open',Boolean(data.length));list.querySelectorAll('[data-suggestion-name]').forEach(button=>button.onclick=()=>{input.value=button.dataset.suggestionName;list.classList.remove('open');});}catch(e){list.classList.remove('open');list.innerHTML='';}},260);}
    function openAddSheet(){let sheet=document.getElementById('trip-sheet');if(!sheet){sheet=document.createElement('section');sheet.id='trip-sheet';sheet.className='trip-sheet';sheet.innerHTML=`<h3>添加到行程</h3><p>先选择省份和城市，再输入地点名称。输入后会搜索地图中的标准地点名称。</p><input id="new-date" type="date"><select id="new-province">${regionProvinces.map(province=>`<option value="${province}">${province}</option>`).join('')}</select><select id="new-city"></select><input id="new-name" class="place-suggestions" placeholder="输入地点名称并选择搜索结果"><div id="place-suggestion-list" class="place-suggestion-list"></div><select id="new-category" style="display:none"><option value="history">历史文化</option></select><input id="new-duration" value="预计1小时" style="display:none"><textarea id="new-note" style="display:none"></textarea><div class="trip-sheet-actions"><button class="cancel" id="close-trip-sheet">取消</button><button id="confirm-add-trip">添加</button></div>`;document.body.appendChild(sheet);document.getElementById('new-province').onchange=populateAddCities;document.getElementById('new-name').oninput=searchPlaceSuggestions;document.getElementById('close-trip-sheet').onclick=()=>sheet.classList.remove('open');document.getElementById('confirm-add-trip').onclick=async()=>{const name=document.getElementById('new-name').value.trim();const rawDate=document.getElementById('new-date').value;if(!name||!rawDate)return;const category=inferCategory(name);document.getElementById('new-category').value=category;document.getElementById('new-duration').value=inferDuration(name,category);const day=ensureItineraryDate(rawDate);window.selectedDate=day.date;await addEvent(day.date);document.getElementById('new-name').value='';sheet.classList.remove('open');};}document.getElementById('new-date').value=todayInputValue();document.getElementById('new-province').value=detectedProvince;populateAddCities();document.getElementById('new-city').value=detectedCity;sheet.classList.add('open');if(!userPosition&&navigator.geolocation)navigato     function setupItineraryInteractions(){const root=document.getElementById('itinerary-content');if(!root)return;const old=root.querySelector('[data-editor-panel]');if(old)old.remove();const title=root.querySelector('.app-title');if(title&&!root.querySelector('.add-trip-button')){title.insertAdjacentHTML('afterend','<button class="add-trip-button" type="button" aria-label="添加行程">+</button>');title.nextElementSibling.onclick=openAddSheet;}root.querySelectorAll('.timeline-row .app-card').forEach((card)=>{card.draggable=true;card.addEventListener('dragstart',e=>{const d=itinerary[currentDay()];const cards=[...root.querySelectorAll('.timeline-row .app-card')];e.dataTransfer.setData('text/plain',JSON.stringify({date:d.date,index:cards.indexOf(card)}));card.classList.add('dragging');});card.addEventListener('dragend',()=>card.classList.remove('dragging'));card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drop-target')});card.addEventListener('dragleave',()=>card.classList.remove('drop-target'));card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drop-target');const src=JSON.parse(e.dataTransfer.getData('text/plain'));const cards=[...root.querySelectorAll('.timeline-row .app-card')];moveEvent(src.date,src.index,window.selectedDate,cards.indexOf(card));});});root.querySelectorAll('[data-day]').forEach(btn=>{btn.addEventListener('dragover',e=>e.preventDefault());btn.addEventListener('drop',e=>{e.preventDefault();const src=JSON.parse(e.dataTransfer.getData('text/plain'));moveEvent(src.date,src.index,btn.dataset.day,999);});});}
    function enableTouchDrag(){let timer=null,drag=null,target=null;document.querySelectorAll('#itinerary-content .timeline-row .app-card').forEach(card=>{card.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const cards=[...document.querySelectorAll('#itinerary-content .timeline-row .app-card')];timer=setTimeout(()=>{drag={date:window.selectedDate,index:cards.indexOf(card)};card.dataset.suppressClick='1';card.classList.add('dragging');},420);});card.addEventListener('pointermove',e=>{if(!drag)return;target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.app-card,.day-picker button');document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));if(target)target.classList.add('drop-target');});card.addEventListener('pointerup',e=>{clearTimeout(timer);if(!drag)return;e.preventDefault();document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));const dropCard=target?.closest('.app-card');const dropDay=target?.closest('[data-day]');if(dropCard){const cards=[...document.querySelectorAll('#itinerary-content .timeline-row .app-card')];moveEvent(drag.date,drag.index,window.selectedDate,cards.indexOf(dropCard));}else if(dropDay)moveEvent(drag.date,drag.index,dropDay.dataset.day,999);card.classList.remove('dragging');drag=null;target=null;setTimeout(()=>delete card.dataset.suppressClick,0);});card.addEventListener('pointercancel',()=>{clearTimeout(timer);if(drag){card.classList.remove('dragging');drag=null;target=null;}});});}

    function normalizeItineraryHeader(){const root=document.getElementById('itinerary-content');const title=root?.querySelector('.app-title');if(!root||!title)return;root.querySelector('.app-eyebrow')?.remove();root.querySelector('.itinerary-city')?.remove();let top=root.querySelector('.itinerary-top');if(!top){top=document.createElement('div');top.className='itinerary-top';title.parentNode.insertBefore(top,title);top.appendChild(title);}const add=root.querySelector('.add-trip-button');if(add)top.appendChild(add);const sub=root.querySelector('.app-sub');if(sub)sub.textContent=dayCities(itinerary[currentDay()]).join(' → ')||'待确认城市';root.querySelectorAll('[data-day]').forEach(btn=>{const dayData=itinerary.find(x=>x.date===btn.dataset.day);if(!dayData?.events.length){btn.remove();return;}const day=btn.querySelector('b'),small=btn.querySelectorAll('small')[1];if(day)day.textContent=dateCardDay(btn.dataset.day);if(small)small.textContent=weekdayForDate(btn.dataset.day);});root.querySelectorAll('.timeline-row .app-meta').forEach(meta=>{meta.innerHTML=meta.innerHTML.replace(/公开地图定位：.*?评价、票价与开放信息待确认。/g,'').replace(/<br>\s*<br>/g,'<br>').replace(/^<br>|<br>$/g,'');});const summary=root.querySelector('.route-summary');if(summary){summary.className='day-expense';summary.innerHTML=`<span>当日花销</span><b>${dayExpense(itinerary[currentDay()]?.date)}</b>`;}centerSelectedDay();}
