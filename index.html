<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="" />
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #1f2937; overflow: hidden; }
    header { padding: 16px 20px 10px; background: #fff; border-bottom: 1px solid #dfe5ec; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: #64748b; font-size: 13px; }

    #map { min-height: 620px; }
    aside { overflow: auto; background: #fff; border-left: 1px solid #dfe5ec; padding: 14px; }
    .filters { display: grid; gap: 8px; margin-bottom: 14px; }
    label { display:flex; gap:10px; align-items:center; font-size: 14px; min-height:44px; }
    input { accent-color: #2563eb; }
    .legend { display:flex; flex-wrap:wrap; gap:7px 12px; padding-bottom: 12px; border-bottom:1px solid #e5e7eb; }
    .swatch { width: 10px; height: 10px; border-radius:50%; display:inline-block; margin-right:4px; }
    .item { padding: 10px 0; border-bottom:1px solid #eef2f7; cursor:pointer; }
    .item:hover { background:#f8fafc; }
    .item strong { display:block; font-size:14px; }
    .item small { color:#64748b; line-height:1.45; }
    .maplibregl-popup-content { padding: 12px 14px; line-height: 1.5; border-radius:8px; }
    .popup-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .popup-meta { color:#64748b; font-size:12px; margin-bottom: 5px; }
    .note { margin-top: 12px; color:#64748b; font-size:12px; line-height:1.5; }
    .map-bg { fill:#f4f1e7; }
    .road { fill:none; stroke:#d68b72; stroke-width:2.2; opacity:.78; }
    .road:nth-of-type(2n) { stroke:#e4ad91; stroke-width:1.3; }
    .river { fill:none; stroke:#79b9d1; stroke-width:13; opacity:.78; stroke-linecap:round; }
    .park { fill:#cfe2b9; stroke:#a9c895; stroke-width:1; opacity:.9; }
    .place-label { fill:#6b6259; font-size:18px; font-family:"Microsoft YaHei",sans-serif; font-weight:500; opacity:.82; }
    .mobile-tools,.mobile-sheet,.sheet-backdrop,.location-status { display:none; }
    .navigate-link { display:inline-block; margin-top:8px; padding:8px 10px; background:#1f65c1; color:#fff; border-radius:6px; text-decoration:none; }
    @media (max-width: 760px) {
      header,aside { display:none; }
      .layout { display:block; height:100dvh; min-height:0; }
      #map { height:100dvh; min-height:0; }
      .mobile-tools { display:grid; grid-template-columns:repeat(3,1fr); position:fixed; z-index:12; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); background:#fffffff2; border:1px solid #dce3ec; border-radius:16px; padding:7px; box-shadow:0 5px 22px #17203335; backdrop-filter:blur(12px); }
      .mobile-tools button { border:0; background:transparent; min-height:48px; border-radius:10px; color:#334155; font-size:14px; }
      .mobile-tools button.is-active { background:#1f65c1; color:#fff; }
      .mobile-sheet { display:block; position:fixed; z-index:14; left:0; right:0; bottom:0; max-height:72dvh; overflow:auto; background:#fff; border-radius:18px 18px 0 0; padding:12px 16px calc(18px + env(safe-area-inset-bottom)); transform:translateY(110%); transition:transform .2s ease; box-shadow:0 -8px 30px #17203330; }
      .mobile-sheet.open { transform:translateY(0); }
      .sheet-backdrop { position:fixed; inset:0; z-index:13; background:#11182755; }
      .sheet-backdrop.open { display:block; }
      .sheet-handle { width:40px; height:4px; border-radius:4px; background:#cbd5e1; margin:0 auto 12px; }
      .sheet-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
      .sheet-head strong { font-size:17px; }
      .sheet-head button { border:0; background:#eef2f7; width:40px; height:40px; border-radius:50%; font-size:19px; }
      .mobile-filter { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
      .mobile-filter label { border:1px solid #dbe2ea; border-radius:10px; padding:7px 10px; min-height:50px; }
      .mobile-list { margin-top:12px; }
      .mobile-list .item { padding:12px 2px; }
      .location-status { position:fixed; display:block; z-index:11; top:10px; left:10px; right:10px; background:#fffffff2; border-radius:12px; padding:10px 12px; box-shadow:0 3px 14px #17203325; font-size:13px; pointer-events:none; }
      .location-status:empty { display:none; }
      .maplibregl-ctrl-top-left { top:50px; }
      .maplibregl-popup-content { max-width:280px; }
    }
    .app-view{display:none;position:fixed;inset:0;z-index:20;background:#fbfbfc;color:#20212a;overflow:auto;padding:28px 18px 110px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    .app-view.active{display:block}
    .app-inner{max-width:760px;margin:0 auto}
    .app-eyebrow{font-size:13px;color:#5d55a6;font-weight:700}
    .app-title{font-size:30px;line-height:1.15;margin:7px 0;color:#20212a}
    .app-sub{font-size:14px;color:#767987}
    .route-summary{display:flex;justify-content:space-between;align-items:center;margin:20px 0 16px;padding:16px 18px;border-radius:20px;background:#eeedfb;color:#57556b;font-size:14px}
    .day-picker{display:flex;gap:9px;overflow:auto;padding:2px 0 7px;margin-bottom:20px}
    .day-picker button{flex:0 0 82px;padding:12px 7px 14px;border:1px solid #e7e8ed;border-radius:16px;background:#fff;color:#20212a;font:inherit;cursor:pointer}
    .day-picker button b{display:block;font-size:22px;margin:7px 0}.day-picker button small{color:#767987;font-size:12px}.day-picker button.active{background:#ddd8f2;border-color:#d3caed;color:#403b7f}.day-picker button.active small{color:#5d55a6}
    .timeline{position:relative;margin-top:18px}.timeline:before{content:"";position:absolute;left:52px;top:16px;bottom:18px;width:2px;background:#d9d7ee}.timeline-row{position:relative;display:grid;grid-template-columns:48px 1fr;gap:16px;margin-bottom:16px}.timeline-row time{font-size:13px;font-weight:700;color:#5d55a6;padding-top:16px}.timeline-dot{position:absolute;left:47px;top:19px;width:12px;height:12px;border-radius:50%;background:#5d55a6;box-shadow:0 0 0 4px #fbfbfc}.app-card{margin:0;padding:16px;border:1px solid #e7e8ed;border-radius:19px;background:#fff;box-shadow:0 5px 16px #25283a09;cursor:pointer}.app-card h3{margin:0 0 7px;font-size:17px}.app-meta{color:#767987;font-size:13px;line-height:1.6}.app-card.highlight{background:#eeedfb;border-color:#d8d2f0}.app-note{margin:12px 0;padding:12px 14px;border-radius:14px;background:#eeedfb;color:#57556b;font-size:13px;line-height:1.6}
    .detail-head{margin:-28px -18px 18px;padding:18px;background:#eeedfb;border-bottom:1px solid #dedaf4}.back-button{border:0;background:transparent;padding:0;color:#403b7f;font-weight:700;font-size:13px;cursor:pointer}.detail-head h2{font-size:28px;margin:22px 0 5px}.app-button{display:block;width:100%;border:0;border-radius:14px;background:#5d55a6;color:#fff;padding:13px;text-align:center;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}.detail-card{margin:14px 0;padding:17px;border:1px solid #e7e8ed;border-radius:20px;background:#fff;box-shadow:0 5px 16px #25283a09}.detail-card h3{margin:0 0 9px;font-size:18px}.detail-card p{margin:0;color:#767987;font-size:13px;line-height:1.65}.detail-note{margin:12px 0;padding:12px 14px;border-radius:14px;background:#eeedfb;color:#57556b;font-size:13px;line-height:1.6}
    .discover-view{padding:0;overflow:hidden;background:transparent;pointer-events:none}.discover-view.active{display:block}.discover-controls{position:absolute;z-index:2;left:18px;right:18px;top:18px;pointer-events:auto;background:#fffffff2;border-radius:18px;padding:15px;box-shadow:0 5px 20px #25283a20}.discover-controls h2{margin:0 0 5px;font-size:23px}.discover-controls p{margin:0;color:#767987;font-size:13px}.discover-filters{display:flex;gap:7px;overflow:auto;margin-top:12px}.discover-filters button{border:1px solid #e7e8ed;border-radius:999px;background:#fff;color:#767987;padding:8px 11px;white-space:nowrap;font:inherit;font-size:12px;cursor:pointer}.discover-filters button.active{background:#5d55a6;color:#fff;border-color:#5d55a6}.discover-sheet{position:absolute;z-index:2;left:0;right:0;bottom:76px;max-height:42vh;overflow:auto;border-radius:22px 22px 0 0;background:#fbfbfc;padding:17px 18px;pointer-events:auto;box-shadow:0 -8px 25px #25283a20}.discover-sheet h3{margin:0 0 10px;font-size:18px}.discover-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #e7e8ed;cursor:pointer}.discover-row .swatch{width:10px;height:10px;border-radius:50%;background:#5d55a6;margin-top:5px;flex:none}.discover-row strong{display:block;font-size:15px}.discover-row small{color:#767987;line-height:1.5}
    .bottom-nav{position:fixed;z-index:30;left:18px;right:18px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);padding:9px 8px 10px;border:1px solid #e7e8ed;border-radius:22px;background:#fffffff2;box-shadow:0 8px 28px #25283a24;backdrop-filter:blur(12px)}.bottom-nav button{border:0;background:transparent;color:#8b8d99;font:inherit;font-size:12px;cursor:pointer}.bottom-nav button span{display:block;margin:auto auto 4px;width:34px;height:28px;border-radius:10px;font-size:20px;line-height:28px}.bottom-nav button.active{color:#403b7f;font-weight:700}.bottom-nav button.active span{background:#eeedfb;color:#5d55a6}
    body .mobile-tools{display:none}.discover-locate{border:0;border-radius:999px;background:#5d55a6;color:#fff;padding:8px 11px;font:inherit;font-size:12px;cursor:pointer;float:right;margin-top:-5px}
    @media (min-width:761px){.app-view{padding-bottom:30px}.bottom-nav{left:auto;right:24px;bottom:24px;width:380px}.discover-sheet{left:auto;width:380px;right:24px;bottom:100px;border-radius:22px}.discover-controls{left:24px;right:auto;width:420px;top:24px}}
    body[data-mode="discover"] header,body[data-mode="discover"] aside{display:none}body[data-mode="discover"] .layout{height:100vh}
  </style>
</head>
<body>
  <section id="next-view" class="app-view active" aria-label="下一项安排"><div class="app-inner" id="next-content"></div></section>
  <section id="itinerary-view" class="app-view" aria-label="每日行程"><div class="app-inner" id="itinerary-content"></div></section>
  <section id="detail-view" class="app-view" aria-label="地点详情"><div class="app-inner" id="detail-content"></div></section>
  <section id="discover-view" class="app-view discover-view" aria-label="发现身边"><div class="discover-controls"><button type="button" class="discover-locate" onclick="locate()">⌖ 定位附近</button><h2>发现身边</h2><p>地图全览 · 找到附近值得去的地方</p><div class="discover-filters" id="discover-filters"></div></div><div class="discover-sheet"><h3>附近地点</h3><div id="discover-list"></div></div></section>
  <nav class="bottom-nav" aria-label="主导航"><button type="button" data-view="next"><span>⌁</span>下一项安排</button><button type="button" data-view="itinerary"><span>▦</span>行程安排</button><button type="button" data-view="discover"><span>⌖</span>发现身边</button></nav>
  <header><h1>沈阳旅行地图</h1><div class="sub">按类别筛选值得去、值得玩、值得吃的地点；点地图标记可看推荐理由。</div></header>
  <div class="layout">
    <div id="map" aria-label="沈阳旅行地点地图"></div>
    <aside>
      <div class="legend" id="legend"></div>
      <div class="filters" id="filters"></div>
      <div id="list"></div>
      <div class="note">已整理 <span id="place-count">0</span> 个标记。短评优先整理自附件文章，作者未亲测或可能变动的项目已注明；图片为地点或类别的代表性配图。国庆前请再确认营业、排队、搬迁和预约规则，开放、票价以官方公告为准。</div>
    </aside>
  </div>
  <div class="location-status" id="location-status" aria-live="polite"></div>
  <nav class="mobile-tools" aria-label="地图工具">
    <button type="button" id="locate-btn">⌖ 我的位置</button>
    <button type="button" id="nearby-btn">◎ 附近</button>
    <button type="button" id="filter-btn">☷ 分类</button>
  </nav>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="mobile-sheet" id="mobile-sheet" aria-label="分类和地点筛选">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><strong>分类筛选</strong><button type="button" id="sheet-close" aria-label="关闭">×</button></div>
    <div class="mobile-filter" id="mobile-filter"></div>
    <div class="mobile-list" id="mobile-list"></div>
  </section>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <script>
    const categories = {
      history: {name:'历史文化', color:'#b45309', img:'https://images.unsplash.com/photo-1548013146-72479768bada?w=900'},
      museum: {name:'博物馆', color:'#7c3aed', img:'https://images.unsplash.com/photo-1564399579883-451a5d44ec08?w=900'},
      nature: {name:'公园自然', color:'#15803d', img:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900'},
      district: {name:'街区夜游', color:'#0369a1', img:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=900'},
      food: {name:'特色餐饮', color:'#dc2626', img:'https://images.unsplash.com/photo-1552566626-52f8b828add9?w=900'},
      leisure: {name:'洗浴休闲', color:'#0891b2', img:'https://images.unsplash.com/photo-1544161515-4ab6ce6db874?w=900'}
    };
    const places = [
      {n:'沈阳故宫',c:'history',lat:41.7967,lng:123.4495,t:'附件作者评价：沈阳作为“一朝发祥地、两代帝王都”的核心遗存，红墙绿瓦是区别于北京故宫的特色；位于市中心，交通、吃住方便，适合和中街、大帅府连线。可自助讲解，预约规则以官方为准。'},
      {n:'张学良旧居（大帅府）',c:'history',lat:41.7926,lng:123.4580,t:'附件作者评价：中西合璧、多元建筑风格是最大看点；位于中街商圈，位置优越、吃住方便，可与金融博物馆购买联票。'},
      {n:'清福陵（东陵）',c:'history',lat:41.7763,lng:123.5309,t:'附件作者评价：位置较远，适合有时间再前往；清代皇家陵寝，园林与古树适合慢逛。'},
      {n:'新乐遗址博物馆',c:'history',lat:41.8537,lng:123.4020,t:'沈阳新石器时代遗址，适合喜欢考古和城市源流的人。'},
      {n:'“九一八”历史博物馆',c:'museum',lat:41.8362,lng:123.4668,t:'附件作者评价：位置偏、展品数量适中，半天可逛完；展陈集中呈现侵华日军累累罪行和东北抗日联军英勇奋战的历史，带孩子参观也有教育意义。'},
      {n:'辽宁省博物馆',c:'museum',lat:41.7108,lng:123.4314,t:'附件作者评价：馆藏丰富、展厅多，书画展品尤其突出；建议留出半天到一天，关注当期展览和预约。馆内餐厅与文创方便，但餐饮价格偏高。'},
      {n:'辽宁省科技馆',c:'museum',lat:41.7094,lng:123.4300,t:'附件作者评价：展项丰富，有儿童活动中心、4D/动感/球幕/IMAX影院和VR展，亲子科普很合适；VR、影院和儿童区可能另收费，需提前预约或当日预约。'},
      {n:'沈阳博物馆',c:'museum',lat:41.7971,lng:123.4317,t:'了解沈阳城市史，可与市府广场、老城线路组合。'},
      {n:'抗美援朝烈士陵园',c:'museum',lat:41.7706,lng:123.4453,t:'纪念性场馆，适合与近现代历史线路组合。'},
      {n:'金融博物馆',c:'museum',lat:41.7920,lng:123.4562,t:'附件作者评价：紧邻张学良旧居，讲解中国货币及金融发展史，馆不大，约3小时内可逛完；可购买大帅府与金融博物馆联票，具体票务以官方为准。'},
      {n:'锡伯族博物馆',c:'museum',lat:41.8060,lng:123.3950,t:'附件作者评价：位置偏、展品较少，建议酌情前往；亮点是讲解锡伯族从东北迁往西北的历史，适合对锡伯族文化感兴趣的游客。'},
      {n:'盛京大剧院',c:'district',lat:41.7440,lng:123.4320,t:'附件作者评价：外形像钻石，位于K11附近，常有各类巡回演出；演出票务和演出日历需提前查询。'},
      {n:'沈阳科学宫',c:'museum',lat:41.7900,lng:123.4100,t:'附件作者评价：近年更新设施，体验感好、人相对少；有球幕影院，靠近三好街和青年大街商圈，适合安排半天。'},
      {n:'古生物博物馆',c:'museum',lat:41.9625,lng:123.4300,t:'附件作者评价：位于沈阳航空航天大学校门附近，适合古生物爱好者；入馆需爬较长楼梯，夏季馆内可能偏热，预约规则需提前确认。'},
      {n:'中国工业展览馆',c:'museum',lat:41.7900,lng:123.4050,t:'附件作者评价：系统展示中国工业发展历程及成就，靠近三好街，适合工业史和城市发展主题线路。'},
      {n:'红梅产业园',c:'district',lat:41.8060,lng:123.3730,t:'附件作者评价：重工业转型产业园，作者暂未实地体验，建议参考其他攻略确认当前展陈、商业和开放情况。'},
      {n:'北陵公园（昭陵）',c:'nature',lat:41.8285,lng:123.4210,t:'附件作者评价：市中心、周边繁华；想近距离参观陵寝区，建议白天购票时段进入，早晚部分时段可能免票。入园体感降温明显，建议多穿衣服。'},
      {n:'棋盘山风景区',c:'nature',lat:41.9605,lng:123.6870,t:'附件作者评价：因山形像两位老人下棋得名，邻近动物园，适合亲子休闲；节假日适合自驾但需留意拥堵。'},
      {n:'沈阳国家森林公园',c:'nature',lat:42.0200,lng:123.7500,t:'郊区森林和登山路线，适合安排整天。'},
      {n:'沈阳世博园',c:'nature',lat:41.9490,lng:123.6670,t:'园林、花卉和步行空间，适合不想爬山的一天。'},
      {n:'沈阳森林动物园',c:'nature',lat:41.9620,lng:123.6930,t:'亲子和动物主题，通常需要预留半天以上。'},
      {n:'南湖公园',c:'nature',lat:41.7700,lng:123.4050,t:'附件作者评价：兼顾人文景观和游乐设施，拥有沈阳市内较大的游乐场；下午或夕阳前后更出片，游乐场开放时间和项目以现场为准。'},
      {n:'中山公园',c:'nature',lat:41.7900,lng:123.3980,t:'附件作者评价：靠近沈阳站和商圈，占地较大，兼有自然与人文景观，适合顺路散步。'},
      {n:'沈水湾公园',c:'nature',lat:41.7350,lng:123.4040,t:'附件作者评价：面积大、自然景观好，可骑单车、放风筝和野餐（不可明火烧烤）；沿浑河与其他公园相连，骑共享单车要注意服务区边界。'},

    const layers = {}, markers = {};

    };
    let userPosition=null, nearbyOnly=false, userMarker=null;
    const selected=Object.fromEntries(Object.keys(categories).map(k=>[k,true]));
    places.forEach((p,i)=>{
      const cat=categories[p.c];
      const d=details[p.n]||{};
      const image=p.img||cat.img;

      const book=p.book||d.book;
      const extra=(price||book)?`<div style="margin-top:6px">${price?`<b>门票：</b>${price}<br>`:''}${book?`<b>预约：</b>${book}`:''}</div>`:'';
      const nav=`https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.n)}&callnative=1`;
      const popupHtml=`<div class="popup-title">${p.n}</div><img src="${image}" alt="${p.n}代表性图片" style="width:100%;max-height:150px;object-fit:cover;border-radius:4px;margin:5px 0"><div class="popup-meta">${cat.name}</div><div>${p.t}</div>${extra}<a class="navigate-link" href="${nav}" target="_blank" rel="noopener">在地图中导航</a>`;
      const m=new maplibregl.Marker({color:cat.color}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup({maxWidth:'290px'}).setHTML(popupHtml)).addTo(map);
      layers[p.c].push(m); markers[i]=m; p.i=i;
    });
    const legend=document.getElementById('legend');
    const filters=document.getElementById('filters');

      legend.insertAdjacentHTML('beforeend',`<span style="font-size:12px"><i class="swatch" style="background:${v.color}"></i>${v.name}</span>`);

    });
    const distanceKm=(a,b)=>{const r=6371, dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;const q=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;return 2*r*Math.asin(Math.sqrt(q));};
    const isVisible=p=>selected[p.c]&&(!nearbyOnly||(userPosition&&distanceKm(userPosition,p)<=5));

      if(!userPosition)return a.i-b.i;
      return distanceKm(userPosition,a)-distanceKm(userPosition,b);

    function applyVisibility(){places.forEach(p=>markers[p.i].getElement().style.display=isVisible(p)?'':'none');renderList();}

    function setStatus(message){const el=document.getElementById('location-status');el.textContent=message; if(message)setTimeout(()=>{if(el.textContent===message)el.textContent='';},5000);}
    function locate(){

        const dot=document.createElement('div');dot.style.cssText='width:18px;height:18px;border:4px solid white;border-radius:50%;background:#1677ff;box-shadow:0 0 0 5px #1677ff44';
        userMarker=new maplibregl.Marker({element:dot}).setLngLat([userPosition.lng,userPosition.lat]).addTo(map);
        map.flyTo({center:[userPosition.lng,userPosition.lat],zoom:13});
        setStatus(`定位成功，精度约 ${Math.round(userPosition.accuracy)} 米`);applyVisibility();
      },err=>{const msg=err.code===1?'定位权限被拒绝，请在浏览器设置中允许位置访问':'暂时无法获取位置，请检查 GPS 和网络';setStatus(msg);},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
    }
    document.getElementById('locate-btn').addEventListener('click',locate);
    document.getElementById('nearby-btn').addEventListener('click',()=>{if(!userPosition){setStatus('请先点击“我的位置”完成定位');return;}nearbyOnly=!nearbyOnly;document.getElementById('nearby-btn').classList.toggle('is-active',nearbyOnly);applyVisibility();setStatus(nearbyOnly?'只显示当前位置 5 公里内地点':'已显示全部已选分类地点');});
    document.getElementById('place-count').textContent=places.length;
    renderList();
    const itinerary=[
      {date:'10月1日',label:'故宫线',route:'沈阳老城线',stay:'中街 / 东中街',events:[
        {time:'10:30',name:'沈阳故宫',duration:'预计2.5小时',note:'红墙绿瓦；建议提前预约。'},
        {time:'14:00',name:'张学良旧居（大帅府）',duration:'预计2小时',note:'中西合璧建筑；与金融博物馆步行衔接。'},
        {time:'16:00',name:'金融博物馆',duration:'预计1.5小时',note:'货币与金融史；可关注联票。'},
        {time:'17:30',name:'中街步行街',duration:'晚餐和夜游',note:'老边饺子、马家烧麦、中街冰点城。'}]},
      {date:'10月2日',label:'北部线',route:'九一八 → 北陵 → 西塔',stay:'北陵 / 北站 / 中街',events:[
        {time:'09:40',name:'“九一八”历史博物馆',duration:'预计2小时20分钟',note:'近现代历史主题；建议预留安静参观时间。'},
        {time:'12:30',name:'沈阳北塔护国法轮寺',duration:'预计45分钟',note:'北陵线路上的历史补充点。'},
        {time:'14:40',name:'北陵公园（昭陵）',duration:'预计3小时',note:'皇家陵寝与古树；白天进入陵寝核心区。'},
        {time:'18:30',name:'西塔街',duration:'晚餐和夜游',note:'鱼饼汤、师任堂、正谈炸鸡、烤鳗鱼。'}]},
      {date:'10月3日',label:'洗浴住宿',route:'棋盘山 → 清河半岛',stay:'清河半岛内部',events:[
        {time:'09:30',name:'棋盘山风景区',duration:'预计3小时',note:'近郊山水；国庆自驾预留拥堵。'},
        {time:'13:30',name:'沈阳世博园',duration:'预计2.5小时（二选一）',note:'也可改为沈阳森林动物园。'},
        {time:'17:00',name:'清河半岛',duration:'洗浴 + 住宿一晚',note:'造浪池、温泉、桑拿；提前确认住宿套餐。'}]},
      {date:'10月4日',label:'博物馆线',route:'辽博 → 辽科馆 → 科学宫',stay:'浑南奥体 / K11',events:[
        {time:'11:30',name:'辽宁省博物馆',duration:'预计2.5小时',note:'馆藏丰富；重点关注书画和当期展览。'},
        {time:'15:00',name:'辽宁省科技馆',duration:'预计2小时',note:'VR、球幕和儿童活动可能另收费。'},
        {time:'17:40',name:'沈阳科学宫',duration:'预计1.5小时',note:'设施更新，靠近三好街。'}]},
      {date:'10月5日',label:'机动日',route:'市区补逛 / 按离沈时间调整',stay:'不固定',events:[
        {time:'09:00',name:'沈阳博物馆',duration:'预计1.5小时（可选）',note:'适合补充沈阳城市史。'},
        {time:'10:30',name:'南湖公园',duration:'预计1.5小时（可选）',note:'散步、拍照，离开时间紧则跳过。'},
        {time:'12:00',name:'怪坡风景区',duration:'预计3.5小时（晚离沈可选）',note:'可与怪坡虎园组合；早离沈不安排。'}]}
    ];
    const placeByName=name=>places.find(p=>p.n===name)||places.find(p=>p.n.includes(name))||null;
    const currentDay=()=>itinerary.findIndex(x=>x.date===window.selectedDate);
    window.selectedDate='10月1日';
    function navButtons(view){const active=view==='detail'?'itinerary':view;document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===active));}
    function showView(view){document.querySelectorAll('.app-view').forEach(x=>x.classList.remove('active'));document.body.dataset.mode=view;const el=document.getElementById(view+'-view');if(el)el.classList.add('active');navButtons(view);if(view==='discover'){map.resize();renderDiscover('all');}}
    function renderNext(){const day=itinerary[0],e=day.events[0];document.getElementById('next-content').innerHTML=`<div class="app-eyebrow">下一项安排 · ${day.date}</div><h2 class="app-title">前往${e.name}</h2><div class="app-sub">停车后步行 · 建议到达 ${e.time}</div><div class="route-summary"><span>${day.route}</span><b>${day.events.length} 项安排</b></div><div class="detail-card"><h3>${e.name}</h3><p>${e.note}</p><p style="margin-top:8px;color:#767987">${e.duration}</p><button class="app-button" data-detail="${e.name}" style="margin-top:14px">查看地点详情　›</button></div><div class="detail-card"><h3>下一站</h3><p>${day.events[1].name} · ${day.events[1].duration}</p></div><div class="detail-note">提醒：故宫和大帅府建议提前预约，国庆期间预留排队时间。</div>`;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));}
    function renderItinerary(){const d=itinerary[currentDay()]||itinerary[0];document.getElementById('itinerary-content').innerHTML=`<div class="app-eyebrow">沈阳自驾 · 完整行程</div><h2 class="app-title">每日行程</h2><div class="app-sub">10月1日 — 10月5日 · 选择日期查看当天安排</div><div class="route-summary"><span>${d.route}</span><b>${d.events.length} 项安排</b></div><div class="day-picker">${itinerary.map(x=>`<button type="button" class="${x.date===d.date?'active':''}" data-day="${x.date}"><small>${x.label}</small><b>${x.date.slice(3)}</b><small>${x.stay}</small></button>`).join('')}</div><div class="timeline">${d.events.map(e=>`<div class="timeline-row"><time>${e.time}</time><i class="timeline-dot"></i><div class="app-card ${e.name==='清河半岛'?'highlight':''}" data-detail="${e.name}"><h3>${e.name}</h3><div class="app-meta">${e.duration}<br>${e.note}</div></div></div>`).join('')}</div><div class="app-note">点击任一时间卡片进入地点详情；住宿点会显示入住时间、凭证和准备事项。</div>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{window.selectedDate=b.dataset.day;renderItinerary();});document.querySelectorAll('.timeline-row [data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));}
    function openDetail(name){const p=placeByName(name);if(!p)return;const isStay=p.n==='清河半岛';const d=details[p.n]||{};const nav=`https://uri.amap.com/marker?position=${p.lng},${p.lat}&name=${encodeURIComponent(p.n)}&callnative=1`;const practical=isStay?'<b>入住准备：</b>身份证、预订凭证、泳衣、充电器、换洗衣物<br><b>确认事项：</b>住宿套餐、入住/退房时间、停车和项目收费':`${d.price?`<b>门票：</b>${d.price}<br>`:''}${d.book?`<b>预约：</b>${d.book}`:'开放、票价和预约规则以官方公告为准'}`;document.getElementById('detail-content').innerHTML=`<div class="detail-head"><button class="back-button" id="detail-back">‹　返回${window.selectedDate}行程</button><h2>${p.n}</h2><div class="app-sub">${isStay?'行程内住宿详情':'行程内地点详情'} · ${categories[p.c].name}</div></div><div class="detail-card"><h3>推荐评价</h3><p>${p.t}</p><a class="app-button" href="${nav}" target="_blank" rel="noopener" style="margin-top:14px">地图导航　↗</a></div><div class="detail-card"><h3>${isStay?'入住准备':'实用信息'}</h3><p>${practical}</p></div><div class="detail-note">来源：附件攻略整理；个人体验和价格信息可能变化，请以景区、酒店或官方渠道为准。</div>`;document.getElementById('detail-back').onclick=()=>{renderItinerary();showView('itinerary');};showView('detail');}
    function renderDiscover(filter){const allowed=filter==='all'?null:filter;const list=places.filter(p=>!allowed||p.c===allowed).slice(0,30);document.getElementById('discover-list').innerHTML=list.map(p=>`<div class="discover-row" data-discover-detail="${p.n}"><i class="swatch" style="background:${categories[p.c].color}"></i><div><strong>${p.n}</strong><small>${categories[p.c].name} · ${p.t}</small></div></div>`).join('');document.querySelectorAll('[data-discover-detail]').forEach(x=>x.onclick=()=>openDetail(x.dataset.discoverDetail));}
    const discoverFilters=document.getElementById('discover-filters');Object.entries(categories).forEach(([k,v])=>discoverFilters.insertAdjacentHTML('beforeend',`<button type="button" data-discover-cat="${k}">${v.name}</button>`));discoverFilters.insertAdjacentHTML('afterbegin','<button type="button" class="active" data-discover-cat="all">全部</button>');document.querySelectorAll('[data-discover-cat]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-discover-cat]').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderDiscover(b.dataset.discoverCat);});
    document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
    renderNext();renderItinerary();renderDiscover('all');showView('next');
  </script>
